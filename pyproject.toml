[project]
name = "overtime-processor"
version = "0.1.0"
description = "A project to process overtime files."
requires-python = ">=3.8"
license = {text = "MIT"}

dependencies = [
    "python-dotenv==1.0.1",
    "openpyxl==3.1.5",
    "pywin32==306",
    "gspread==6.1.2",
    "pandas==2.2.3",
    "xlrd==2.0.1"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

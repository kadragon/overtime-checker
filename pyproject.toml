[project]
name = "overtime-processor"
version = "0.1.0"
description = "A project to process overtime files."
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "python-dotenv==1.2.3",
    "openpyxl==3.1.5",
    "pandas==3.0.5",
    "xlrd==2.0.2",
    "rich==15.0.0",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

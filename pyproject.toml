[project]
name = "overtime-processor"
version = "0.1.0"
description = "A project to process overtime files."
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "python-dotenv==1.1.1",
    "openpyxl==3.1.5",
    "pandas==2.3.0",
    "xlrd==2.0.1"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]
